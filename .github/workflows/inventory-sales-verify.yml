name: Inventory Sales Workbench Verification

on:
  push:
    branches:
      - feature/inventory-sales-workbench

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Decision Tests
        run: npm run test:decision
      - name: Inventory Sales Workbench Tests
        run: npx tsx -e "import { runInventorySalesWorkbenchTests } from './src/services/__tests__/inventorySalesWorkbench.test.ts'; const r = runInventorySalesWorkbenchTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: Inventory Sales Priority Queue Tests
        run: npx tsx -e "import { runInventorySalesPriorityTests } from './src/services/__tests__/inventorySalesPriority.test.ts'; const r = runInventorySalesPriorityTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: Listing Preparation Safety Tests
        run: npx tsx -e "import { runListingPreparationTests } from './src/services/__tests__/listingPreparation.test.ts'; const r = runListingPreparationTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: Listing Draft Final Review Safety Tests
        run: npx tsx -e "import { runListingDraftReviewTests } from './src/services/__tests__/listingDraftReview.test.ts'; const r = runListingDraftReviewTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: Listing Publish Gate Safety Tests
        run: npx tsx -e "import { runListingPublishGateTests } from './src/services/__tests__/listingPublishGate.test.ts'; const r = runListingPublishGateTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: Listing Pre-Publish Safety Tests
        run: npx tsx -e "import { runListingPrePublishCheckTests } from './src/services/__tests__/listingPrePublishCheck.test.ts'; const r = runListingPrePublishCheckTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: Listing Publish Dry Run Safety Tests
        run: npx tsx -e "import { runListingPublishDryRunTests } from './src/services/__tests__/listingPublishDryRun.test.ts'; const r = runListingPublishDryRunTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: Listing Publish Adapter Simulation Tests
        run: npx tsx -e "import { runListingPublishAdapterTests } from './src/services/__tests__/listingPublishAdapter.test.ts'; const r = runListingPublishAdapterTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: Marketplace API Mapping Verification Tests
        run: npx tsx -e "import { runMarketplaceApiMappingTests } from './src/services/__tests__/marketplaceApiMapping.test.ts'; const r = runMarketplaceApiMappingTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: eBay Publish Prerequisite Safety Tests
        run: npx tsx -e "import { runEbayPublishPrerequisiteTests } from './src/services/__tests__/ebayPublishPrerequisite.test.ts'; const r = runEbayPublishPrerequisiteTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: eBay Official Payload Preview Safety Tests
        run: npx tsx -e "import { runEbayOfficialPayloadPreviewTests } from './src/services/__tests__/ebayOfficialPayloadPreview.test.ts'; const r = runEbayOfficialPayloadPreviewTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: Full Test Suite
        run: npm run test:all
      - name: Production Build
        run: npm run build
