name: Photo Capture MVP Verification

# Verification is intentionally scoped to the photo-capture feature branch.
on:
  push:
    branches:
      - feature/photo-capture-mvp

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Decision Tests
        run: npm run test:decision
      - name: Photo Capture Input Abstraction Tests
        run: npx tsx -e "import { runPhotoCaptureInputTests } from './src/services/__tests__/photoCaptureInput.test.ts'; const r = runPhotoCaptureInputTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: Photo QA Tests
        run: npx tsx -e "import { runPhotoQaTests } from './src/services/__tests__/photoQa.test.ts'; const r = runPhotoQaTests(); console.log(r.log.join('\\n')); if (r.failed) process.exit(1);"
      - name: Full Test Suite
        run: npm run test:all
      - name: Production Build
        run: npm run build
